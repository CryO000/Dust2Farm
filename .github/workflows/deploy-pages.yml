name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export Dakhla demo data
        run: python -m backend.export_static_demo
      - name: Build static Next.js site
        run: npm ci && npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_DEMO: "true"
          NEXT_PUBLIC_BASE_PATH: "/Dust2Farm"
      - name: Generate jury QR code
        run: |
          python -m venv .qr-venv
          .qr-venv/bin/python -m pip install "qrcode[pil]"
          .qr-venv/bin/python scripts/generate_demo_qr.py "https://cryo000.github.io/Dust2Farm/dakhla/"
          cp demo-qr.png out/demo-qr.png
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
